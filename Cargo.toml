[package]
name = "manti"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
gotcha = { git = "https://github.com/Kilerd/gotcha.git", branch = "main", features=["cors", "openapi"] }

# Database ORM
conservator = { git = "https://github.com/kilerd/conservator.git", branch = "main" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"

# Lazy static
once_cell = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for LLM providers
reqwest = { version = "0.12", features = ["json", "stream"] }

# Async trait
async-trait = "0.1"

# Futures
futures = "0.3"

# Authentication
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"

# Configuration
config = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1"
anyhow = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Decimal for precise money calculations
rust_decimal = { version = "1", features = ["db-tokio-postgres", "serde"] }

# Time
time = { version = "0.3", features = ["serde", "formatting"] }
chrono = { version = "0.4", features = ["serde"] }

# Streaming
async-stream = "0.3"
bytes = "1"
tokio-stream = "0.1"


# Tower middleware
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Environment variables
dotenvy = "0.15"
